<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixtures - Prediction League</title>
  <meta name="theme-color" content="#123a24" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Prediction League</h1>
    <nav>
      <a href="index.html">Leaderboard</a>
      <a href="predict.html">Predict</a>
      <a href="fixtures.html" class="active">Fixtures</a>
    </nav>
  </header>

  <main>
    <div id="status" class="status">Loading fixtures...</div>

    <h2>Upcoming</h2>
    <div id="upcoming-list"></div>

    <h2>Finished</h2>
    <div id="finished-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const upcomingEl = document.getElementById('upcoming-list');
    const finishedEl = document.getElementById('finished-list');

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (isError ? 'err' : 'ok');
      statusEl.hidden = false;
    }

    function formatKickoff(iso) {
      return new Date(iso).toLocaleString([], {
        weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
      });
    }

    function upcomingCard(fixture) {
      return `
        <div class="card">
          <div class="fixture-teams">${fixture.home_team} vs ${fixture.away_team}</div>
          <div class="fixture-meta">Kicks off ${formatKickoff(fixture.kickoff_at)}</div>
          <div class="odds-row">
            <span>Home ${fixture.odds_home ?? '-'}</span>
            <span>Draw ${fixture.odds_draw ?? '-'}</span>
            <span>Away ${fixture.odds_away ?? '-'}</span>
          </div>
        </div>
      `;
    }

    function finishedCard(fixture) {
      return `
        <div class="card">
          <div class="fixture-teams">
            ${fixture.home_team} ${fixture.home_score} - ${fixture.away_score} ${fixture.away_team}
          </div>
          <div class="fixture-meta">${formatKickoff(fixture.kickoff_at)}</div>
        </div>
      `;
    }

    async function loadFixtures() {
      const { data: fixtures, error } = await db
        .from('fixtures')
        .select('*')
        .order('kickoff_at', { ascending: true });

      if (error) {
        showStatus(`Couldn't load fixtures: ${error.message}`, true);
        return;
      }

      if (fixtures.length === 0) {
        showStatus('No fixtures loaded yet -- run the fetch-odds script (see README).');
        return;
      }

      statusEl.hidden = true;

      const upcoming = fixtures.filter((f) => f.status === 'scheduled');
      const finished = fixtures.filter((f) => f.status === 'finished');

      upcomingEl.innerHTML = upcoming.length
        ? upcoming.map(upcomingCard).join('')
        : '<div class="fixture-meta">Nothing upcoming.</div>';

      finishedEl.innerHTML = finished.length
        ? finished.map(finishedCard).join('')
        : '<div class="fixture-meta">No results yet.</div>';
    }

    loadFixtures();
  </script>
</body>
</html>
