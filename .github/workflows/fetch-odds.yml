name: Fetch odds

# Tuesday through Friday mornings -- Tuesday is safely after the previous
# gameweek's Monday night game has finished (see the "Weekly timeline"
# section in README.md), but bookmakers don't always have odds posted for
# every fixture that early. Re-running it a few more times through the
# week catches any fixture whose odds show up late, well before Friday's
# kickoff -- upserting on external_id means this only ever refreshes
# fixtures, never duplicates them.
on:
  schedule:
    - cron: "0 9 * * 2-5"
  workflow_dispatch: # lets you also trigger this manually from the Actions tab

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run fetch-odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
