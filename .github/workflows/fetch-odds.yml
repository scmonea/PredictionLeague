name: Fetch odds

# Tuesday mornings -- safely after the previous gameweek's Monday night
# game has finished, well before the next Friday's kickoff. See the
# "Weekly timeline" section in README.md for why Tuesday.
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: # lets you also trigger this manually from the Actions tab

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run fetch-odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
