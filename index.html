<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prediction League</title>
  <meta name="theme-color" content="#1e1033" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Prediction League</h1>
    <div id="player-badge" class="player-badge"></div>
    <nav>
      <a href="index.html" class="active">Leaderboard</a>
      <a href="predict.html">Predict</a>
      <a href="info.html">Info</a>
    </nav>
  </header>

  <main>
    <p class="hint">
      Click any name below to see their full prediction history -- including
      your own, any time. Other players' picks for a fixture only become
      visible once it's kicked off.
    </p>
    <div id="status" class="status">Loading leaderboard...</div>
    <table id="leaderboard" hidden>
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th class="points">Points</th>
          <th class="points">Exact scores</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const table = document.getElementById('leaderboard');
    const tbody = document.getElementById('leaderboard-body');

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (isError ? 'err' : 'ok');
      statusEl.hidden = false;
    }

    async function loadLeaderboard() {
      // Start from every signed-up player, not just ones with a scored
      // prediction -- so someone who's joined but hasn't predicted (or
      // whose picks haven't been scored yet) still shows up, at 0.
      const { data: players, error: playersError } = await db
        .from('players')
        .select('id, display_name');

      if (playersError) {
        showStatus(`Couldn't load the leaderboard: ${playersError.message}`, true);
        return;
      }

      if (players.length === 0) {
        showStatus('No players have signed up yet.');
        return;
      }

      // Then layer in every prediction that's actually been scored (points
      // is only filled in once its fixture is marked finished), plus the
      // fixture's actual score, to work out exact hits.
      const { data, error } = await db
        .from('predictions')
        .select('player_id, points, predicted_home_score, predicted_away_score, fixtures(home_score, away_score)')
        .not('points', 'is', null);

      if (error) {
        showStatus(`Couldn't load the leaderboard: ${error.message}`, true);
        return;
      }

      // Sum points (and count exact-score hits, used as a tiebreaker) per
      // player, on the client -- fine at friends-league scale. Keyed by
      // player id (names could theoretically collide in display, ids can't).
      // Seeded with every player at 0 so nobody's missing from the table.
      const totals = new Map(players.map((p) => [p.id, { display_name: p.display_name, points: 0, exact: 0 }]));
      for (const row of data) {
        const existing = totals.get(row.player_id);
        if (!existing) continue; // player was deleted after predicting; skip
        existing.points += Number(row.points);
        if (row.predicted_home_score === row.fixtures.home_score && row.predicted_away_score === row.fixtures.away_score) {
          existing.exact += 1;
        }
      }

      const ranked = [...totals.entries()].sort((a, b) => b[1].points - a[1].points || b[1].exact - a[1].exact);

      tbody.innerHTML = ranked
        .map(([id, { display_name, points, exact }], i) => `
          <tr>
            <td class="rank">${i + 1}</td>
            <td><a href="player.html?id=${encodeURIComponent(id)}">${escapeHtml(display_name)}</a></td>
            <td class="points">${points}</td>
            <td class="points">${exact}</td>
          </tr>
        `)
        .join('');

      statusEl.hidden = true;
      table.hidden = false;
    }

    loadLeaderboard();
    showPlayerBadge();
  </script>
</body>
</html>
